name: release

on:
  push:
    tags:
      - 'v*'

# По умолчанию токен только читает. Запись есть только у задачи publish.
permissions:
  contents: read

jobs:
  # Сначала те же проверки, что в CI (.github/workflows/ci.yml): тесты на
  # Node 22 и 24 в трёх поясах, тесты ревью, проверка индекса и пакета.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Право записи нужно только для gh release create / upload.
    permissions:
      contents: write
    steps:
      # Действие закреплено по SHA коммита: тег можно передвинуть, коммит — нет.
      # fetch-depth: 0 — нужна история, чтобы проверить, что метка стоит на коммите из main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, version and branch
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('rust-autowipe/plugin.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с version ${VERSION} в plugin.json"
            exit 1
          fi
          # Выпуск — только из кода, который уже есть в main.
          TAG_COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Метка ${GITHUB_REF_NAME} стоит на коммите, которого нет в ветке main"
            exit 1
          fi

      # Пакет пересобирается из исходников этой метки. pack.py без --allow-repack
      # останавливает выпуск, если файлы в закоммиченном пакете другие, и в конце
      # запускает check_index.py. После пересборки dist/ и index.json должны
      # остаться такими, как в коммите. base-url — тот же каталог, что в
      # закоммиченном index.json (raw-ссылка на main/dist или GitHub Releases).
      - name: Rebuild package and compare with the committed one
        run: |
          set -euo pipefail
          BASE_URL=$(python3 -c "import json,posixpath;d=json.load(open('index.json',encoding='utf-8'));print(posixpath.dirname([e for e in d['plugins'] if e['name']=='rust-autowipe'][0]['downloadUrl']))")
          python3 tools/pack.py --base-url "$BASE_URL"
          if ! git diff --exit-code -- dist index.json; then
            echo "::error::Пересобранный пакет или index.json не совпадает с закоммиченным"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist index.json)" ]; then
            git status --porcelain -- dist index.json
            echo "::error::Пакета этой версии нет в коммите: соберите его (python tools/pack.py) и закоммитьте dist/ и index.json"
            exit 1
          fi

      # Уже опубликованный файл выпуска не заменяется. Если он есть, его sha256
      # сверяется с пакетом; другой файл — ошибка, выпуск останавливается.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dist/rust-autowipe-${VERSION}.catpkg.zip"
          NAME="$(basename "$PKG")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/published"
            if gh release download "$TAG" --pattern "$NAME" --dir "$RUNNER_TEMP/published"; then
              LOCAL_SHA=$(sha256sum "$PKG" | cut -d' ' -f1)
              PUBLISHED_SHA=$(sha256sum "$RUNNER_TEMP/published/$NAME" | cut -d' ' -f1)
              if [ "$LOCAL_SHA" != "$PUBLISHED_SHA" ]; then
                echo "::error::В выпуске $TAG уже есть другой $NAME (sha256 $PUBLISHED_SHA, пакет $LOCAL_SHA). Опубликованный файл не меняется: поднимите версию"
                exit 1
              fi
              echo "Выпуск $TAG уже содержит этот же $NAME — ничего не меняется"
            else
              gh release upload "$TAG" "$PKG"
            fi
          else
            gh release create "$TAG" "$PKG" \
              --verify-tag \
              --title "Rust AutoWipe ${VERSION}" \
              --notes "Плагин автовайпов Rust для панели Catalyst. Индекс маркетплейса: https://raw.githubusercontent.com/kafder100/RustWipe/main/index.json"
          fi
