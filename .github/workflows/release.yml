name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check package is committed
        run: ls -l dist/*.catpkg.zip

      # Пакет уже лежит в dist/ (его собирает tools/pack.py перед коммитом),
      # поэтому релиз — это только публикация ассета к тегу.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.catpkg.zip --clobber
          else
            gh release create "$TAG" dist/*.catpkg.zip \
              --title "Rust AutoWipe ${VERSION}" \
              --notes "Плагин автовайпов Rust для панели Catalyst. Индекс маркетплейса: https://raw.githubusercontent.com/kafder100/RustWipe/main/index.json"
          fi
