name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Пакет уже лежит в dist/ (его собирает tools/pack.py перед коммитом),
      # поэтому релиз — это только публикация ассета к тегу.
      - name: Check tag and package match plugin.json
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('rust-autowipe/plugin.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с version ${VERSION} в plugin.json"
            exit 1
          fi
          test -f "dist/rust-autowipe-${VERSION}.catpkg.zip" || {
            echo "::error::Нет dist/rust-autowipe-${VERSION}.catpkg.zip — соберите python tools/pack.py"
            exit 1
          }

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG="dist/rust-autowipe-${VERSION}.catpkg.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" --clobber
          else
            gh release create "$TAG" "$PKG" \
              --title "Rust AutoWipe ${VERSION}" \
              --notes "Плагин автовайпов Rust для панели Catalyst. Индекс маркетплейса: https://raw.githubusercontent.com/kafder100/RustWipe/main/index.json"
          fi
